name: Windows tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Parse and run deterministic QA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in @('.ps1', '.psm1') }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$($file.Name): $($errors.Message -join '; ')"
            }
          }
          & .\Test-Live-Codex-Usage.ps1

      - name: Build release package
        shell: powershell
        run: .\Build-Release.ps1 -SkipTests

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: live-codex-usage-monitor
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
